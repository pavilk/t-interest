services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tinterest}
      POSTGRES_USER: ${POSTGRES_USER:-tinterest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_DB: tinterest_test
      POSTGRES_USER: tinterest_test
      POSTGRES_PASSWORD: tinterest_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinterest_test -d tinterest_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
